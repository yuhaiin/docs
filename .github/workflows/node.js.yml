name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      # This temporary upgrade migration commits the newly resolved lockfile
      # back to the same-repository PR branch. Removed after regeneration.
      - name: Regenerate and commit dependency lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Astro 7 dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm run check:links
      - run: npm run build
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./dist
          external_repository: yuhaiin/yuhaiin.github.io
          publish_branch: main
          enable_jekyll: false
          destination_dir: documents
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-docs
          path: dist/
          if-no-files-found: ignore
