name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Resolve current dependencies; npm install also refreshes the lockfile
      # when a dependency range changes.
      - run: npm install --no-audit --no-fund
      - run: npm run check:links
      - run: npm run build
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          publish_dir: ./dist
          external_repository: yuhaiin/yuhaiin.github.io
          publish_branch: main
          enable_jekyll: false
          destination_dir: documents
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: static-docs
          path: dist/
          if-no-files-found: ignore
